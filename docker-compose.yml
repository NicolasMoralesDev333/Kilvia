services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kilvia}
      POSTGRES_USER: ${POSTGRES_USER:-kilvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kilvia_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kilvia} -d ${POSTGRES_DB:-kilvia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kilvia_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-kilvia}:${POSTGRES_PASSWORD:-kilvia_local_only}@postgres:5432/${POSTGRES_DB:-kilvia}?sslmode=disable"
      - "up"
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kilvia}:${POSTGRES_PASSWORD:-kilvia_local_only}@postgres:5432/${POSTGRES_DB:-kilvia}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456}
      FRONTEND_ORIGIN: http://localhost:4200
      HTTP_ADDR: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  kilvia_postgres_data:
